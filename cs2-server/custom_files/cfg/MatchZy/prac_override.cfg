// Executed by MatchZy right after prac.cfg (practice mode). Updates never overwrite this file.
// Keeps practice mode after map changes and adds the extras from the old utility config.
matchzy_autostart_mode 2
mp_timelimit 0
mp_ignore_round_win_conditions 1
sv_grenade_trajectory_prac_trailtime 5
ammo_grenade_limit_default 99
ammo_grenade_limit_flashbang 99
ammo_grenade_limit_total 99

// Bunny hop on
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_staminamax 0
sv_staminajumpcost 0
sv_staminalandcost 0
