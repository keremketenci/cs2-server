// Executed by MatchZy right after config.cfg when the plugin loads. Updates never overwrite this file.
// MatchZy is only loaded in the FACEIT / Utility modes (modes/*.cfg); the mode's *_settings.cfg sets matchzy_autostart_mode.

// Demo recording is off by default. Admins turn it on for the next match with !demoon (and off with !demooff).
// Resets to off when the server restarts.
matchzy_demo_recording_enabled false
