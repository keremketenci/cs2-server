// Normal CS2 movement. Run at the start of every map by every modes/*_settings.cfg (GameModeManager, 0.5 s after map start).
// Workshop maps can set their own movement, e.g. awp_bhop_rocket sets sv_maxspeed 10000, sv_airaccelerate 2000 and
// autobhop (which also leaves noclip stuck on that map). This makes sure none of it carries over to the next map or mode.
exec settings/movement_restore.cfg
sv_autobunnyhopping 0
sv_falldamage_scale 1

echo "settings/movement_defaults.cfg executed"
