// ===== MODE: FREE PLAY ROUNDS =====
// Free Play with real rounds: 16000 money and buy anywhere, but dead players wait for the next round and
// rounds end normally (team eliminated, bomb exploded or defused, time up). Unlimited rounds, no halftime.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Free Play Rounds"), then the map changes.
// freeplay_rounds_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "Free Play Rounds"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
