// Runs on every map start of "Retake" (GameModeManager). Valve competitive rules, then the retake cvars.
exec gamemode_competitive.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg

// Retake round rules (short freeze time, no money, no C4 on spawn, 30 rounds). The Retakes plugin runs this
// file again 1 s after map start, so it always wins over gamemode_competitive.cfg.
exec cs2-retakes/retakes.cfg

// Match end restarts the same map unless an !rtv vote picked something else
exec settings/map_voting.cfg
// No bots: Retakes balances the human players itself
exec settings/no_bots.cfg

echo "modes/retake_settings.cfg executed"
