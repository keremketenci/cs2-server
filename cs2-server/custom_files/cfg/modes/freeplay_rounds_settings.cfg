// Runs on every map start of "Free Play Rounds" (GameModeManager).
// Same as freeplay_settings.cfg, but rounds end and nobody respawns until the next round.
exec gamemode_casual.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg
sv_cheats 1
exec settings/alltalk_on.cfg
exec settings/no_bots.cfg
exec settings/bots_dont_buy.cfg
mp_friendlyfire 0
mp_teammates_are_enemies 0
// Rounds end normally: elimination, bomb exploded / defused, time up
mp_ignore_round_win_conditions 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_give_player_c4 1
// Money and buying like Free Play
mp_buy_anywhere 1
mp_buytime 999999
mp_maxmoney 16000
mp_startmoney 16000
mp_afterroundmoney 16000
// Grenades: one of each type plus 2 flashbangs (HE, smoke, molotov/incendiary, decoy, 2 flash = 6).
// gamemode_casual.cfg limits to 3 in total and 1 flash. Thrown grenades are used up as usual.
ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 6
mp_freezetime 0
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_round_restart_delay 5
// Unlimited rounds: the match never ends, no side swap
mp_maxrounds 999
mp_halftime 0
mp_match_can_clinch 0
mp_timelimit 0
mp_warmuptime 0
mp_warmup_end
sv_cheats 0
echo "modes/freeplay_rounds_settings.cfg executed"
