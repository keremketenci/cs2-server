// ===== MODE: AWP =====
// AWP maps: everyone spawns with an AWP, no buying, normal movement (awp_bhop_rocket sets its own).
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "AWP"), then the map changes.
// awp_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "AWP"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
css_plugins load "plugins/disabled/K4-DamageInfo/K4-DamageInfo.dll"
css_plugins load "plugins/disabled/CS2-Remove-Map-Weapons/CS2-Remove-Map-Weapons.dll"
css_plugins load "plugins/disabled/MutualScoringPlayers/MutualScoringPlayers.dll"
