// ===== MODE: WINGMAN =====
// Valve wingman: 2v2 on one bombsite.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Wingman"), then the map changes.
// wingman_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 2
sv_skirmish_id 0
css_gamemode "Wingman"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
