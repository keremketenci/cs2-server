// Runs on every map start of "Free Play" (GameModeManager) and on server start (it is the default mode).
// Instant respawn, buy anywhere, rounds never end, no bots.
exec gamemode_casual.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg
sv_cheats 1
exec settings/alltalk_on.cfg
exec settings/no_bots.cfg
exec settings/bots_dont_buy.cfg
mp_friendlyfire 0
mp_teammates_are_enemies 0
mp_ignore_round_win_conditions 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 2
mp_buy_anywhere 1
mp_buytime 999999
mp_maxmoney 16000
mp_startmoney 16000
mp_afterroundmoney 16000
// Grenades: one of each type plus 2 flashbangs (HE, smoke, molotov/incendiary, decoy, 2 flash = 6).
// gamemode_casual.cfg limits to 3 in total and 1 flash. Thrown grenades are used up as usual.
ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 6
// Rounds never end here, so CS2 never resets the per-round grenade purchase count:
// GrenadeRebuy gives a thrown grenade back to buy again (carry limits above still apply). reset.cfg turns it off.
grenade_rebuy_enabled 1
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_timelimit 0
mp_warmuptime 0
mp_warmup_end
sv_cheats 0
echo "modes/freeplay_settings.cfg executed"
