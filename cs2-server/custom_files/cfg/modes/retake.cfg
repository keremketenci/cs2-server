// ===== MODE: RETAKE =====
// B3none Retakes: every round starts with the bomb planted, Ts defend the site, CTs retake it.
// Weapons from Ravid-A's RetakesAllocator (!guns, first 2 rounds pistols), Instadefuse, Clutch Announce.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Retake"), then the map changes.
// retake_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 1
sv_skirmish_id 0
css_gamemode "Retake"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
// Retakes first: the allocator looks up its event capability right after loading
css_plugins load "plugins/disabled/RetakesPlugin/RetakesPlugin.dll"
css_plugins load "plugins/disabled/RetakesAllocator/RetakesAllocator.dll"
css_plugins load "plugins/disabled/InstadefusePlugin/InstadefusePlugin.dll"
css_plugins load "plugins/disabled/ClutchAnnouncePlugin/ClutchAnnouncePlugin.dll"
