// Unloads every plugin that is only loaded by a mode (plugins/disabled/*, plus Advertisement).
// Names are each plugin's ModuleName (css_plugins list), checked against the plugin sources.
// "Could not unload plugin" in the console just means that plugin was not loaded.
css_plugins unload "MatchZy"
css_plugins unload "Deathmatch"
css_plugins unload "CS2_GunGame"
css_plugins unload "Remove Map Weapons"
css_plugins unload "Damage Informations"
css_plugins unload "MutualScoringPlayers"
// Retake: allocator before Retakes (it unhooks from the Retakes event capability on unload)
css_plugins unload "[Retakes] Weapons Allocator"
css_plugins unload "Retakes Plugin"
css_plugins unload "Instadefuse Plugin"
css_plugins unload "Clutch Announce Plugin"
// Advertisement (!rtv reminder) loads on startup from plugins/, modes with RTV load it again.
css_plugins unload "Advertisement"
