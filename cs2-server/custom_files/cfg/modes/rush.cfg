// ===== MODE: RUSH =====
// Valve rush (hidden mode, max 6 players) on its own map rush_001.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Rush"), then the map changes.
// rush_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 6
sv_skirmish_id 0
css_gamemode "Rush"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
