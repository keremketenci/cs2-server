// Executed by the Retakes plugin when it is unloaded (modes/unload_plugins.cfg on every mode change).
// The generated file set bot_quota 10, mp_maxrounds 24 and more. Here modes/reset.cfg and the next mode's
// *_settings.cfg already restore everything retakes.cfg changes, so this only resets what they leave alone.
mp_join_grace_time 30
mp_match_can_clinch 1
mp_autokick 1
mp_warmuptime 60

echo [Retakes] Unload config loaded!
