// ===== MODE: AIM =====
// Aim maps: weapons come from the map, no buying.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Aim"), then the map changes.
// aim_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "Aim"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
css_plugins load "plugins/disabled/K4-DamageInfo/K4-DamageInfo.dll"
css_plugins load "plugins/disabled/MutualScoringPlayers/MutualScoringPlayers.dll"
