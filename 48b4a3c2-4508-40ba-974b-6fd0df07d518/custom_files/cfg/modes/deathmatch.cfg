// ===== MODE: DEATHMATCH =====
// Deathmatch plugin (NockyCZ): !gun / !dm to pick weapons, bots fill the server.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Deathmatch"), then the map changes.
// deathmatch_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "Deathmatch"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
css_plugins load "plugins/disabled/CS2-Remove-Map-Weapons/CS2-Remove-Map-Weapons.dll"
css_plugins load "plugins/disabled/Deathmatch/Deathmatch.dll"
css_plugins load "plugins/disabled/MutualScoringPlayers/MutualScoringPlayers.dll"
