// ===== MODE: GUN GAME =====
// GunGame plugin (GG2): every kill gives the next weapon, first to finish the knife level wins.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Gun Game"), then the map changes.
// gungame_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "Gun Game"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
css_plugins load "plugins/disabled/GG2/GG2.dll"
css_plugins load "plugins/disabled/CS2-Remove-Map-Weapons/CS2-Remove-Map-Weapons.dll"
css_plugins load "plugins/disabled/MutualScoringPlayers/MutualScoringPlayers.dll"
