// Runs on every map start of "Gun Game" (GameModeManager). Based on kus/cs2-modded-server cfg/gg_settings.cfg.
exec gamemode_casual.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg

sv_cheats 1

exec settings/one_round.cfg
exec settings/no_warmup.cfg
exec settings/alltalk_on.cfg
exec settings/map_voting.cfg
exec settings/no_drop_weapons.cfg
exec settings/bots_dont_buy.cfg

mp_friendlyfire 0
mp_forcecamera 0
mp_solid_teammates 0
mp_teammates_are_enemies 0
mp_free_armor 2
mp_buy_anywhere 0
mp_buy_during_immunity 0
mp_respawn_immunitytime 2

// Bots
exec bots.cfg

// Disable end of map vote for GunGame
css_rtv_end_of_map_vote false


sv_cheats 0

echo "modes/gungame_settings.cfg executed"
