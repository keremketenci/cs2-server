// ===== MODE: UTILITY PRACTICE =====
// MatchZy practice mode: .rethrow, .last, .savenade, .bot, .spawn ... Extras are in MatchZy/prac_override.cfg.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Utility Practice"), then the map changes.
// utility_settings.cfg runs on every map start of this mode.
game_type 3
game_mode 0
sv_skirmish_id 0
css_gamemode "Utility Practice"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled false
css_plugins load "plugins/disabled/MatchZy/MatchZy.dll"
