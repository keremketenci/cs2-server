// Runs on every map start of "Aim" (GameModeManager). Based on kus/cs2-modded-server cfg/aim_settings.cfg.
exec gamemode_casual.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg

sv_cheats 1

// Inspired by https://github.com/mavproductions

exec settings/alltalk_on.cfg
exec settings/map_voting.cfg
exec settings/no_bots.cfg
exec settings/no_buying.cfg
exec settings/bots_dont_buy.cfg

mp_team_intro_time 0
mp_maxrounds 24
mp_freezetime 0
mp_roundtime 1.92
mp_round_restart_delay 5
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_ignore_round_win_conditions 0
mp_autokick 0
mp_free_armor 2
mp_autoteambalance 0
mp_limitteams 0
sv_disable_radar 1
mp_warmuptime 15


sv_cheats 0

echo "modes/aim_settings.cfg executed"
