// Runs on every map start of "Wingman" (GameModeManager). Valve's own rules from gamemode_competitive2v2.cfg.
exec gamemode_competitive2v2.cfg
// No movement settings from the previous (workshop) map
exec settings/movement_defaults.cfg

// Match end restarts the same map unless an !rtv vote picked something else
exec settings/map_voting.cfg
// No bots by default: !bat / !bac add one
exec settings/no_bots.cfg

echo "modes/wingman_settings.cfg executed"
