// ===== MODE: COMPETITIVE =====
// Valve competitive rules (MR12), without MatchZy.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Competitive"), then the map changes.
// competitive_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 1
sv_skirmish_id 0
css_gamemode "Competitive"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
