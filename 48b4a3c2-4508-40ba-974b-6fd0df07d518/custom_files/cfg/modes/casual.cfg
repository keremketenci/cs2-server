// ===== MODE: CASUAL =====
// Valve casual: 10v10 style rules, buy menu, rounds and bomb.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Casual"), then the map changes.
// casual_settings.cfg runs on every map start of this mode.
game_type 0
game_mode 0
sv_skirmish_id 0
css_gamemode "Casual"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
