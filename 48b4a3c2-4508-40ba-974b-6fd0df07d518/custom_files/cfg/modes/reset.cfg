// ===== MODE RESET =====
// Resets every setting that any server mode changes (modes/*.cfg and their *_settings.cfg, MatchZy,
// settings/*.cfg toggles, bunny hop, parachute) back to normal competitive values.
// Every mode cfg runs this first, so nothing is left over from the previous mode.

// --- Cheat-protected settings: reset while sv_cheats is still on, otherwise CS2 ignores them ---
sv_cheats 1
buddha 0
sv_infinite_ammo 0
sv_showimpacts 0
sv_grenade_trajectory_prac_pipreview 0
sv_grenade_trajectory_prac_trailtime 0
sv_cheats 0

// --- Repeating hooks from CS2_ExecAfter (they survive map changes until overwritten) ---
exec_after_round_start ""
exec_after_round_start_once ""
exec_after_map_start ""
exec_after_map_start_once ""
exec_after_map_end ""
exec_after_map_end_once ""

// --- Movement: CS2 defaults (bunny hop off, normal acceleration, gravity, stamina) ---
exec settings/movement_restore.cfg
sv_autobunnyhopping 0
sv_falldamage_scale 1

// --- Rounds ---
mp_ignore_round_win_conditions 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_respawn_immunitytime 0
mp_timelimit 0
mp_maxrounds 24
mp_halftime 1
mp_freezetime 15
mp_round_restart_delay 7
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_warmup_pausetimer 0
mp_match_end_restart 0
mp_randomspawn 0

// --- Economy ---
mp_buy_anywhere 0
mp_buy_during_immunity 0
mp_buy_allow_grenades 1
mp_buytime 20
mp_maxmoney 16000
mp_startmoney 800
mp_afterroundmoney 0
mp_playercashawards 1
mp_teamcashawards 1
mp_give_player_c4 1
mp_weapons_allow_zeus 1
mp_max_armor 2

// --- Weapons and grenades ---
ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 4
// GrenadeRebuy (own plugin): only Free Play turns it on
grenade_rebuy_enabled 0
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_ct_default_secondary weapon_hkp2000
mp_t_default_secondary weapon_glock
mp_ct_default_primary ""
mp_t_default_primary ""
mp_ct_default_grenades ""
mp_t_default_grenades ""
mp_free_armor 0
mp_defuser_allocation 0
mp_death_drop_gun 1
mp_death_drop_grenade 2
mp_death_drop_defuser 1
mp_death_drop_taser 1
mp_death_drop_c4 1
mp_drop_knife_enable 0
mp_drop_grenade_enable 1
mp_hostages_max 2
mp_weapons_allow_map_placed 1
mp_disconnect_kills_players 0

// --- Teams ---
mp_friendlyfire 0
mp_teammates_are_enemies 0
mp_solid_teammates 1
mp_autoteambalance 0
mp_limitteams 0
mp_humanteam any
mp_tkpunish 0
mp_forcecamera 1
mp_force_pick_time 15
sv_disable_radar 0

// --- Voice / chat ---
sv_alltalk 0
sv_full_alltalk 0
sv_deadtalk 1
sv_talk_enemy_dead 0
sv_talk_enemy_living 0

// --- Bots ---
bot_quota 0
bot_quota_mode normal
bot_kick
exec settings/bots_buy.cfg

// --- Plugins toggled from the admin menu ---
css_plugins unload "CS2 Parachute"
