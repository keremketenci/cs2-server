// ===== MODE: ARMS RACE =====
// Valve arms race: every kill gives the next weapon, knife kill wins.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "Arms Race"), then the map changes.
// armsrace_settings.cfg runs on every map start of this mode.
game_type 1
game_mode 0
sv_skirmish_id 0
css_gamemode "Arms Race"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled true
css_plugins load "plugins/Advertisement/Advertisement.dll"
