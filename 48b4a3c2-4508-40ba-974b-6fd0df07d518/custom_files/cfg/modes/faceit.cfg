// ===== MODE: FACEIT FF Off (FRIENDLY FIRE OFF) =====
// MatchZy match mode: warmup -> !ready -> knife round -> !stay / !switch -> live match.
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "FACEIT FF Off"), then the map changes.
// faceit_settings.cfg runs on every map start of this mode.
game_type 3
game_mode 0
sv_skirmish_id 0
css_gamemode "FACEIT FF Off"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled false
css_plugins load "plugins/disabled/MatchZy/MatchZy.dll"
