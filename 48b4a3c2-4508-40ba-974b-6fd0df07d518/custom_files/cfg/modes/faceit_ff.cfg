// ===== MODE: FACEIT FF On (FRIENDLY FIRE ON) =====
// Same as FACEIT FF Off, with friendly fire on like real FACEIT (reduced team damage from MatchZy/live.cfg).
// Run by GameModeManager when the mode is picked (!modes, !admin menu, !mode "FACEIT FF On"), then the map changes.
// faceit_ff_settings.cfg runs on every map start of this mode.
game_type 3
game_mode 0
sv_skirmish_id 0
css_gamemode "FACEIT FF On"
exec modes/unload_plugins
exec modes/reset
css_rtv_enabled false
css_plugins load "plugins/disabled/MatchZy/MatchZy.dll"
