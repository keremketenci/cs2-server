// Executed by MatchZy right after warmup.cfg (match mode warmup). Updates never overwrite this file.
// Clears the practice extras from prac_override.cfg
// (MatchZy only resets its own practice settings when leaving practice with .match / .exitprac).
//
// Do NOT set matchzy_autostart_mode here: every mode switch runs css_endmatch, which starts a warmup,
// and this file would then override the mode chosen by modes/*.cfg (ready spam in free play).
mp_ignore_round_win_conditions 0
ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 4

// Bunny hop off
sv_enablebunnyhopping 0
sv_autobunnyhopping 0
sv_staminamax 80
sv_staminajumpcost 0.08
sv_staminalandcost 0.05
