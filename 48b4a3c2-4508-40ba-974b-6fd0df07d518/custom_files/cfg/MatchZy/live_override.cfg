// Executed by MatchZy right after live.cfg (match goes live). Updates never overwrite this file.
//
// Friendly fire is chosen by the mode (modes/faceit.cfg = off, modes/faceit_ff.cfg = on),
// so the "mp_friendlyfire 1" line was removed from MatchZy/live.cfg.
// If MatchZy is updated and live.cfg is replaced, delete that line again, otherwise FF is always on.

// After the match ends, restart on the same map instead of loading the next one.
// The server has no map cycle (custom game mode), so with 0 it stays on the match end screen forever.
// MatchZy then puts the server back into warmup.
mp_match_end_restart 1
